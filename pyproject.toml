[build-system]
requires = ["setuptools>=82,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-intelligence-os"
version = "0.3.0"
description = "Provider-neutral core with point-in-time-safe live Bitcoin market-data ingestion"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Crypto Intelligence OS" }]
dependencies = [
  "pydantic>=2.13.4,<2.14",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.7,<1",
]
research = [
  "numpy>=2.5,<3",
  "scikit-learn>=1.9,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "UP",  # pyupgrade
  "B",   # bugbear
  "S",   # common security checks
  "RUF", # Ruff-specific checks
]
ignore = [
  "S101", # assert is expected in tests and internal validation code
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["crypto_intelligence_os"]
mypy_path = "src"
warn_unused_configs = true
show_error_codes = true

