name: BTC Multi-Timeframe Research Lab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/multitimeframe_lab_v1.py"
      - "tests/test_multitimeframe_lab_v1.py"
      - "docs/multitimeframe_research_contract_v1.md"
      - "scripts/resample_multitimeframe_ohlcv.py"
      - "tests/test_resample_multitimeframe_ohlcv.py"
      - "scripts/multitimeframe_features_v3.py"
      - "tests/test_multitimeframe_features_v3.py"
      - "scripts/multitimeframe_tournament_v1.py"
      - "tests/test_multitimeframe_tournament_v1.py"
      - "scripts/multitimeframe_tournament_v2.py"
      - "tests/test_multitimeframe_tournament_v2.py"
      - "scripts/challenger_v2_agent_contract.py"
      - "tests/test_challenger_v2_agent_contract.py"
      - "scripts/multitimeframe_split_v1.py"
      - "tests/test_multitimeframe_split_v1.py"
      - "scripts/multitimeframe_judge_v1.py"
      - "tests/test_multitimeframe_judge_v1.py"
      - "scripts/multitimeframe_regime_gate_v1.py"
      - "tests/test_multitimeframe_regime_gate_v1.py"
      - "scripts/multitimeframe_prospective_audit_v1.py"
      - "tests/test_multitimeframe_prospective_audit_v1.py"
      - "scripts/multitimeframe_exchange_replication_v1.py"
      - "tests/test_multitimeframe_exchange_replication_v1.py"
      - "scripts/multitimeframe_model_registry_v1.py"
      - "tests/test_multitimeframe_model_registry_v1.py"
      - ".github/workflows/btc-multitimeframe-lab.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project test dependencies
        run: python -m pip install -e ".[dev,research]"

      - name: Verify locked multi-timeframe contract
        run: python -m pytest -q tests/test_multitimeframe_lab_v1.py

      - name: Verify point-in-time resampling core
        run: python -m pytest -q tests/test_resample_multitimeframe_ohlcv.py

      - name: Verify Feature V3 and statistical research core
        run: |
          python -m pytest -q tests/test_multitimeframe_features_v3.py
          python -m pytest -q tests/test_multitimeframe_tournament_v1.py
          python -m pytest -q tests/test_multitimeframe_tournament_v2.py
          python -m pytest -q tests/test_challenger_v2_agent_contract.py
          python -m pytest -q tests/test_multitimeframe_split_v1.py
          python -m pytest -q tests/test_multitimeframe_judge_v1.py
          python -m pytest -q tests/test_multitimeframe_regime_gate_v1.py
          python -m pytest -q tests/test_multitimeframe_prospective_audit_v1.py
          python -m pytest -q tests/test_multitimeframe_exchange_replication_v1.py
          python -m pytest -q tests/test_multitimeframe_model_registry_v1.py

      - name: Generate multi-timeframe manifest
        run: |
          mkdir -p artifacts/multitimeframe
          python scripts/multitimeframe_lab_v1.py \
            --output artifacts/multitimeframe/contract-v1.json

      - name: Upload research contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-multitimeframe-research-contract-v1
          path: artifacts/multitimeframe/contract-v1.json
          if-no-files-found: error
          retention-days: 30


  freeze-readiness-1w:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install research dependencies
        run: python -m pip install -e ".[dev,research]"

      - name: Verify freeze gate contract
        run: python -m pytest -q tests/test_challenger_v3_freeze_gate.py

      - name: Fetch real BTC/USD history
        run: |
          python scripts/fetch_multitimeframe_exchange_audit_v1.py \
            --start "2011-08-18T00:00:00+00:00" \
            --end "2026-09-29T00:00:00+00:00" \
            --output-dir artifacts/real-data

      - name: Build gap-safe point-in-time datasets
        run: |
          PYTHONPATH=. python scripts/prepare_multitimeframe_real_data_v1.py \
            --input-dir artifacts/real-data \
            --output-dir artifacts/prepared

      - name: Run bounded 1W V3 development-validation tournament
        run: |
          mkdir -p artifacts/v3-development artifacts/v3-freeze
          PYTHONPATH=scripts:. python scripts/run_challenger_v3_classical_development.py \
            --data-dir artifacts/prepared \
            --exchange bitstamp \
            --horizon 1w \
            --output artifacts/v3-development/classical-development-1w.json

      - name: Run corrected nested statistical diagnostics
        run: |
          PYTHONPATH=scripts:. python scripts/challenger_v3_statistical_judge.py \
            --evidence-dir artifacts/v3-development \
            --output artifacts/v3-freeze/statistical-1w.json

      - name: Execute pre-Fresh-OOS freeze-readiness gate
        run: |
          PYTHONPATH=scripts:. python scripts/challenger_v3_freeze_gate.py \
            --statistical-report artifacts/v3-freeze/statistical-1w.json \
            --output artifacts/v3-freeze/freeze-readiness-1w.json

      - name: Assert Fresh Locked OOS remained untouched
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          packet = json.loads(Path("artifacts/v3-freeze/freeze-readiness-1w.json").read_text())
          assert packet["fresh_locked_oos_access"] is False
          assert packet["fresh_oos_authorized"] is False
          assert packet["freeze_authorized"] is False
          print("Fresh Locked OOS untouched; readiness is advisory only.")
          PY

      - name: Upload V3 pre-freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: challenger-v3-pre-freeze-1w
          path: |
            artifacts/v3-development/classical-development-1w.json
            artifacts/v3-freeze/statistical-1w.json
            artifacts/v3-freeze/freeze-readiness-1w.json
          if-no-files-found: error
          retention-days: 30
