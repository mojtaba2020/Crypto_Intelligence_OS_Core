name: BTC Hourly Prospective Forecasts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/btc_hourly_prospective.yml"
      - "scripts/btc_hourly_prospective.py"
      - "scripts/stage0_prospective_audit.py"
      - "scripts/paired_block_bootstrap.py"
      - "scripts/build_hourly_model_registry.py"
  workflow_dispatch:
  schedule:
    - cron: "9 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-hourly-prospective
  cancel-in-progress: false

jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e .
      - name: Issue and evaluate hourly forecasts
        run: python scripts/btc_hourly_prospective.py --ledger research/hourly_forecasts.jsonl --scores-ledger research/hourly_scores.jsonl --report .research/hourly_report.json
      - name: Audit resolved prospective forecasts
        run: python scripts/stage0_prospective_audit.py --forecasts research/hourly_forecasts.jsonl --scores research/hourly_scores.jsonl --report .research/prospective_audit.json
      - name: Build fail-closed model registry when historical judge exists
        if: hashFiles('research/hourly_champion_challenger.json') != ''
        run: python scripts/build_hourly_model_registry.py --judge research/hourly_champion_challenger.json --prospective .research/prospective_audit.json --output .research/hourly_model_registry.json
      - name: Validate generated ledger
        run: |
          python -c 'import json,pathlib; p=pathlib.Path("research/hourly_forecasts.jsonl"); rows=[json.loads(x) for x in p.read_text().splitlines() if x.strip()]; assert len(rows)>=4; assert all(x["forecast_usd"]>0 for x in rows[-4:]); print("Validated hourly ledger",len(rows))'
      - name: Commit hourly ledger
        run: |
          if [ -n "$(git status --porcelain -- research/hourly_forecasts.jsonl research/hourly_scores.jsonl)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- research/hourly_forecasts.jsonl
            if [ -f research/hourly_scores.jsonl ]; then
              git add -- research/hourly_scores.jsonl
            fi
            git commit -m "Record hourly BTC forecasts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-report
          path: |
            .research/hourly_report.json
            .research/prospective_audit.json
            .research/hourly_model_registry.json
