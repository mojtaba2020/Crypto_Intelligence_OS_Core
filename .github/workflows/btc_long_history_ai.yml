name: BTC Long History AI Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/import_btc_history.py"
      - "scripts/extend_btc_history_coinbase.py"
      - "scripts/evaluate_btc_long_history.py"
      - "scripts/evaluate_btc_hybrid.py"
      - "scripts/download_btc_ohlcv.py"
      - "src/crypto_intelligence_os/hybrid_forecasting.py"
      - "tests/test_hybrid_forecasting.py"
      - ".github/workflows/btc_long_history_ai.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Complete quality gate
        run: python scripts/quality_gate.py

      - name: Import historical Coin Metrics research data
        run: |
          python scripts/import_btc_history.py \
            --database .research/btc_full_history.sqlite \
            --report .research/import_report.json

      - name: Extend through last completed UTC day from Coinbase
        run: |
          python scripts/extend_btc_history_coinbase.py \
            --database .research/btc_full_history.sqlite \
            --report .research/coinbase_extension_report.json

      - name: Download independent Coinbase OHLCV and volume archive
        run: |
          python scripts/download_btc_ohlcv.py \
            --database .research/coinbase_ohlcv.sqlite \
            --report .research/coinbase_ohlcv_report.json

      - name: Evaluate recent one-year 7-day forecasts
        run: |
          python scripts/evaluate_btc_long_history.py \
            --database .research/btc_full_history.sqlite \
            --report .research/evaluation_7d_1y.json \
            --horizon 7 --step 7 --holdout-days 365

      - name: Evaluate full-history 7-day walk-forward
        run: |
          python scripts/evaluate_btc_long_history.py \
            --database .research/btc_full_history.sqlite \
            --report .research/evaluation_7d_full.json \
            --horizon 7 --step 7 --holdout-days 6000

      - name: Evaluate four-year 30-day forecasts
        run: |
          python scripts/evaluate_btc_long_history.py \
            --database .research/btc_full_history.sqlite \
            --report .research/evaluation_30d_4y.json \
            --horizon 30 --step 30 --holdout-days 1460

      - name: Hybrid versus linear and persistence (7-day recent)
        run: |
          python scripts/evaluate_btc_hybrid.py \
            --database .research/btc_full_history.sqlite \
            --report .research/hybrid_7d_1y.json \
            --horizon 7 --step 7 --holdout-days 365

      - name: Hybrid versus linear and persistence (30-day recent)
        run: |
          python scripts/evaluate_btc_hybrid.py \
            --database .research/btc_full_history.sqlite \
            --report .research/hybrid_30d_4y.json \
            --horizon 30 --step 30 --holdout-days 1460

      - name: Feature ablation on identical seven-day origins
        run: |
          python scripts/evaluate_btc_hybrid.py \
            --database .research/btc_full_history.sqlite \
            --report .research/hybrid_7d_ablation.json \
            --horizon 7 --step 14 --holdout-days 365 --ablation

      - name: Feature ablation on identical thirty-day origins
        run: |
          python scripts/evaluate_btc_hybrid.py \
            --database .research/btc_full_history.sqlite \
            --report .research/hybrid_30d_ablation.json \
            --horizon 30 --step 60 --holdout-days 1460 --ablation

      - name: Show reports
        run: |
          cat .research/import_report.json
          cat .research/coinbase_extension_report.json
          cat .research/coinbase_ohlcv_report.json
          cat .research/evaluation_7d_1y.json
          cat .research/evaluation_7d_full.json
          cat .research/evaluation_30d_4y.json
          cat .research/hybrid_7d_1y.json
          cat .research/hybrid_30d_4y.json
          cat .research/hybrid_7d_ablation.json
          cat .research/hybrid_30d_ablation.json

      - name: Preserve research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-long-history-evaluation
          path: |
            .research/import_report.json
            .research/coinbase_extension_report.json
            .research/coinbase_ohlcv_report.json
            .research/evaluation_7d_1y.json
            .research/evaluation_7d_full.json
            .research/evaluation_30d_4y.json
            .research/hybrid_7d_1y.json
            .research/hybrid_30d_4y.json
            .research/hybrid_7d_ablation.json
            .research/hybrid_30d_ablation.json
          retention-days: 30
