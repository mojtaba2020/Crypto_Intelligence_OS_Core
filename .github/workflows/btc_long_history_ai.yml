name: BTC Long History AI Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - "src/crypto_intelligence_os/**"
      - "tests/**"
      - ".github/workflows/btc_long_history_ai.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Complete quality gate
        run: python scripts/quality_gate.py
      - name: Import historical Coin Metrics research data
        run: python scripts/import_btc_history.py --database .research/btc_full_history.sqlite --report .research/import_report.json
      - name: Extend through last completed UTC day from Coinbase
        run: python scripts/extend_btc_history_coinbase.py --database .research/btc_full_history.sqlite --report .research/coinbase_extension_report.json
      - name: Multi-horizon model benchmark
        run: python -m scripts.evaluate_btc_multihorizon --database .research/btc_full_history.sqlite --report .research/multihorizon_benchmark.json
      - name: Chronological locked-test model tournament
        run: python -m scripts.evaluate_btc_model_tournament --database .research/btc_full_history.sqlite --report .research/model_tournament.json
      - name: Show tournament report
        run: cat .research/model_tournament.json
      - name: Preserve research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-locked-model-tournament
          path: |
            .research/import_report.json
            .research/coinbase_extension_report.json
            .research/multihorizon_benchmark.json
            .research/model_tournament.json
          retention-days: 30
