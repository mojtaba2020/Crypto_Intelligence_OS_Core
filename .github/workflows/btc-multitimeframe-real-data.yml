name: BTC Multi-Timeframe Real Data Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fetch_multitimeframe_exchange_audit_v1.py"
      - "scripts/resample_multitimeframe_ohlcv.py"
      - "scripts/prepare_multitimeframe_real_data_v1.py"
      - "scripts/run_real_multitimeframe_judge_v1.py"
      - ".github/workflows/btc-multitimeframe-real-data.yml"

permissions:
  contents: read

jobs:
  real-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install research dependencies
        run: python -m pip install -e ".[research]"

      - name: Fetch and audit real Bitstamp and Bitfinex hourly BTC/USD history
        run: |
          python scripts/fetch_multitimeframe_exchange_audit_v1.py \
            --start "2011-08-18T00:00:00+00:00" \
            --end "2026-09-29T00:00:00+00:00" \
            --output-dir artifacts/real-data

      - name: Build gap-safe daily weekly monthly datasets
        run: |
          PYTHONPATH=. python scripts/prepare_multitimeframe_real_data_v1.py \
            --input-dir artifacts/real-data \
            --output-dir artifacts/prepared

      - name: Run real Bitstamp validation and locked OOS judge
        run: |
          PYTHONPATH=. python scripts/run_real_multitimeframe_judge_v1.py \
            --data-dir artifacts/prepared \
            --exchange bitstamp \
            --output artifacts/real-judge/bitstamp_locked_judge_v1.json

      - name: Upload real-data evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: btc-real-multitimeframe-evidence-v1
          path: |
            artifacts/real-data/
            artifacts/prepared/
            artifacts/real-judge/
          if-no-files-found: error
          retention-days: 30
