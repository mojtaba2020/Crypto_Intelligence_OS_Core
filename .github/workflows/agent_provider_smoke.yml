name: Agent Provider Smoke Test

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model ID
        required: false
        default: gpt-4o-mini

permissions:
  contents: read

jobs:
  openai-provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require provider secret
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing repository secret OPENAI_API_KEY"
            exit 2
          fi
      - name: Call OpenAI provider
        run: python scripts/openai_provider_smoke.py
