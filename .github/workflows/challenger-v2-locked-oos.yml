name: Challenger V2 Fresh Locked OOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout frozen Challenger V2 branch
        uses: actions/checkout@v7
        with:
          ref: research/challenger-v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install research dependencies
        run: python -m pip install -e ".[research]"
      - name: Fetch immutable Bitstamp and Bitfinex hourly history
        run: |
          python scripts/fetch_multitimeframe_exchange_audit_v1.py \
            --start "2011-08-18T00:00:00+00:00" \
            --end "2026-09-29T00:00:00+00:00" \
            --output-dir artifacts/real-data
      - name: Build gap-safe multitimeframe datasets
        run: |
          PYTHONPATH=. python scripts/prepare_multitimeframe_real_data_v1.py \
            --input-dir artifacts/real-data \
            --output-dir artifacts/prepared
      - name: Run single-use frozen locked OOS judge
        run: |
          PYTHONPATH=. python scripts/run_challenger_v2_locked_oos.py \
            --data-dir artifacts/prepared \
            --exchange bitstamp \
            --output artifacts/challenger_v2_locked_oos.json
      - name: Upload locked OOS evidence
        uses: actions/upload-artifact@v7
        with:
          name: challenger-v2-fresh-locked-oos
          path: artifacts/challenger_v2_locked_oos.json
          if-no-files-found: error
          retention-days: 90
