name: BTC Hourly Live Smoke Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/btc_hourly_prospective.py"
      - ".github/workflows/btc_hourly_prospective.yml"
      - ".github/workflows/btc_hourly_live_smoke.yml"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e .
      - name: Forecast on live Coinbase completed candles
        run: |
          python scripts/btc_hourly_prospective.py \
            --ledger "${RUNNER_TEMP}/hourly_forecasts.jsonl" \
            --scores-ledger "${RUNNER_TEMP}/hourly_scores.jsonl" \
            --report "${RUNNER_TEMP}/hourly_report.json"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"hourly_report.json"; r=json.loads(p.read_text()); assert len(r["issued"]) == 4, r; assert all(x["forecast_usd"] > 0 for x in r["issued"]); print("LIVE HOURLY SMOKE PASS", r["origin_hour_utc"])'
      - name: Upload live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-live-smoke-report
          path: ${{ runner.temp }}/hourly_report.json
