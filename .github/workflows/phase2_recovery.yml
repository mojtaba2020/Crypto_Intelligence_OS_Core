name: Recover and validate Phase 2 v0.1.4

on:
  push:
    branches: ["automation/phase2-v014-recovery-20260919"]
    paths: [".github/workflows/phase2_recovery.yml"]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify original archive and recover the exact v0.1.4 file contents
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()
          source = root / "Crypto_Intelligence_OS_Phase2_RealBTC_Data_v0_1_3.zip"
          expected_source = "815e73a6294ba3ce6ee58d15b1c6ef027ef7cc5f48c13ba3d1a5506c601dc849"
          assert hashlib.sha256(source.read_bytes()).hexdigest() == expected_source, "Unexpected source ZIP"
          prefix = "Crypto_Intelligence_OS_Phase2_RealBTC_Data_v0_1_3/"
          with zipfile.ZipFile(source) as zf:
              files = [info for info in zf.infolist() if not info.is_dir()]
              assert all(info.filename.startswith(prefix) for info in files), "Unexpected ZIP root"
              manifest = json.loads(zf.read(prefix + "bundle_manifest.json"))
              assert manifest["bundle_id"] == "phase2-real-btc-data-v0.1.3"
              assert manifest["bundle_format_version"] == "1.0"
              manifest["bundle_id"] = "phase2-real-btc-data-v0.1.4"
              manifest["description"] = (
                  "Read-only Coinbase BTC/USD ingestion; manifest integrity corrected and verified"
              )
              corrections = {
                  "src/crypto_intelligence_os/adapters/market_data/coinbase.py": (
                      "b656377b16b6c691d3b2564c8d0fdfcd07d7d930e771d82b36ea0edacbac6218", 13047
                  ),
                  "tests/test_point_in_time_phase2.py": (
                      "78cac3e496b525dbcf34d9123e91a5658e41b2c194c0bd3b0dd05d7806810acf", 2391
                  ),
              }
              for entry in manifest["files"]:
                  if entry["path"] in corrections:
                      entry["sha256"], entry["size"] = corrections[entry["path"]]
              expected_manifest_hash = (
                  "48fb3c54c24e894e7e68bb0d4032453c85b886052960f3835c16a32f251a1a0d"
              )
              manifest_bytes = (json.dumps(manifest, indent=2, sort_keys=True) + "\n").encode()
              assert hashlib.sha256(manifest_bytes).hexdigest() == expected_manifest_hash, (
                  "Recovered manifest does not match verified v0.1.4"
              )
              declared = {item["path"]: item for item in manifest["files"]}
              actual = {}
              for info in files:
                  rel = info.filename[len(prefix):]
                  if rel == "bundle_manifest.json":
                      continue
                  path = PurePosixPath(rel)
                  assert path.parts and not path.is_absolute() and ".." not in path.parts
                  assert path.parts[0] != ".github" and path.name != "README.md"
                  assert not stat.S_ISLNK(info.external_attr >> 16), "ZIP symlink"
                  assert rel not in actual, "Duplicate ZIP entry"
                  actual[rel] = info
              assert len(declared) == len(actual) == 17 and set(declared) == set(actual)
              for rel, info in sorted(actual.items()):
                  content = zf.read(info)
                  expected = declared[rel]
                  assert hashlib.sha256(content).hexdigest() == expected["sha256"], rel
                  assert len(content) == expected["size"], rel
                  target = (root / rel).resolve()
                  assert root in target.parents, "Unsafe extraction"
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)
                  print("Verified and staged:", rel)
          print("All 17 files match verified Phase 2 v0.1.4 manifest.")
          coinbase_file = root / "src/crypto_intelligence_os/adapters/market_data/coinbase.py"
          before = "return min(0.5 * (2**attempt), 8.0)"
          after = "return float(min(0.5 * (2**attempt), 8.0))"
          original = coinbase_file.read_text()
          assert original.count(before) == 1, "Unexpected Coinbase retry-delay implementation"
          coinbase_file.write_text(original.replace(before, after))
          print("Applied narrow mypy return-type fix to Phase 2 Coinbase adapter.")
          PY
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run complete quality gate
        run: python scripts/quality_gate.py
      - name: Commit verified Phase 2 code to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/phase2_recovery.yml
          git add -A
          git diff --cached --quiet && { echo "Nothing changed"; exit 1; }
          git commit -m "Stage validated Phase 2 v0.1.4 from verified archive contents"
          git push origin HEAD:automation/phase2-v014-recovery-20260919
