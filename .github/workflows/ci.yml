name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality gate
    runs-on: ubuntu-slim

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Change impact report
        if: github.event_name == 'pull_request'
        run: |
          python scripts/impact_report.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.sha }}" | tee impact-report.md
          cat impact-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run complete quality gate
        run: python scripts/quality_gate.py
