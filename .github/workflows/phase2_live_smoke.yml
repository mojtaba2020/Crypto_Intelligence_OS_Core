name: Phase 2 live BTC USD smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase2_live_smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out private repository
        uses: actions/checkout@v4

      - name: Use Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install read-only market data module
        run: python -m pip install -e .

      - name: Fetch and verify real public Coinbase BTC/USD candles
        run: |
          set -o pipefail
          python scripts/fetch_btc_sample.py | tee phase2_live_smoke_output.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("phase2_live_smoke_output.json").read_text())
          if result.get("bar_count", 0) < 1 or not result.get("bars"):
              raise SystemExit("Coinbase returned no eligible BTC/USD candles")
          print("LIVE SMOKE PASS: public BTC/USD bars received; no trading or API keys used.")
          PY
