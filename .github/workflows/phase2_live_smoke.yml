name: Phase 2 read-only live Coinbase smoke test

on:
  push:
    branches: ["automation/phase2-live-smoke-20260919"]
    paths: [".github/workflows/phase2_live_smoke.yml"]

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install read-only market-data package
        run: python -m pip install -e .
      - name: Fetch Coinbase public BTC/USD sample without authentication
        run: python scripts/fetch_btc_sample.py
