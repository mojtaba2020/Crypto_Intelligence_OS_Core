name: BTC4h continuous forward research
# Separate rolling fallback study: NOT part of the frozen 180-slot formal 30d cohort.
# Runtime uses immutable model dependencies from PR109 and separately pinned continuous adapter.
on:
  workflow_dispatch:
  schedule:
    - cron: "12 0,4,8,12,16,20 * * *"
permissions:
  contents: write
concurrency:
  group: btc4h-continuous-single-writer
  cancel-in-progress: false
jobs:
  continuous:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BTC4H_BASE_SHA: "9de38d2c30c892d6e7ef3d65a0ee5a6507f77dc9"
      BTC4H_CONTINUOUS_ADAPTER_SHA: "d9f8e91a713f170026878434f8514082139f6951"
    steps:
      - uses: actions/checkout@v4
        with:
          # Research dependencies remain immutable; never trust changing main for model code.
          ref: "9de38d2c30c892d6e7ef3d65a0ee5a6507f77dc9"
          fetch-depth: 0
      - name: Overlay only frozen rolling adapter and its append-only publisher
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BTC4H_BASE_SHA:scripts/alpha_coinbase_historical_replay.py"
          git cat-file -e "$BTC4H_BASE_SHA:scripts/alpha_interaction_candidate.py"
          git cat-file -e "$BTC4H_BASE_SHA:scripts/alpha_volume_confirmation.py"
          git cat-file -e "$BTC4H_BASE_SHA:scripts/alpha_volume_historical_replay.py"
          for file in scripts/btc4h_continuous_forward.py .github/scripts/publish_btc4h_continuous.sh; do
            git cat-file -e "$BTC4H_CONTINUOUS_ADAPTER_SHA:$file"
            git show "$BTC4H_CONTINUOUS_ADAPTER_SHA:$file" > "$file"
          done
          python -m compileall -q scripts/btc4h_continuous_forward.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore independent continuous evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research .research
          branch=data/btc4h-continuous-forward
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            for file in btc4h_continuous_forecasts.jsonl btc4h_continuous_scores.jsonl btc4h_continuous_publication_receipts.jsonl btc4h_continuous_start_utc.txt; do
              if git cat-file -e "origin/$branch:research/$file" 2>/dev/null; then
                git show "origin/$branch:research/$file" > "research/$file"
              fi
            done
          fi
          touch research/btc4h_continuous_forecasts.jsonl research/btc4h_continuous_scores.jsonl research/btc4h_continuous_publication_receipts.jsonl
          if [ ! -f research/btc4h_continuous_start_utc.txt ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > research/btc4h_continuous_start_utc.txt
          fi
      - name: Install research package
        run: python -m pip install -e .
      - name: Verify pinned model dependencies import before market access
        run: |
          python - <<'PY'
          from scripts.btc4h_continuous_forward import (
              VERSION, calculate_issue, calculate_score, origin_at
          )
          from datetime import UTC, datetime
          assert VERSION == "btc4h-continuous-v1-ridge100"
          assert origin_at(datetime(2026, 11, 14, 3, 40, tzinfo=UTC)) == datetime(2026, 11, 14, 0, 0, tzinfo=UTC)
          print("PASS: frozen model dependencies + continuous adapter import successfully")
          PY
      - name: Publish independent start anchor
        run: bash .github/scripts/publish_btc4h_continuous.sh anchor
      - name: Issue a genuinely live BTC4h forecast
        id: issue
        continue-on-error: true
        run: |
          python -m scripts.btc4h_continuous_forward --phase issue --ledger research/btc4h_continuous_forecasts.jsonl --score-ledger research/btc4h_continuous_scores.jsonl --report .research/continuous_issue.json --code-sha "$BTC4H_CONTINUOUS_ADAPTER_SHA"
      - name: Publish new forecast before scoring
        if: steps.issue.outcome == 'success'
        run: bash .github/scripts/publish_btc4h_continuous.sh issue
      - name: Confirm newly issued continuous forecast against remote Git before target close
        if: steps.issue.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          status="$(python -c 'import json; print(json.load(open(".research/continuous_issue.json"))["newly_issued"])')"
          if [ "$status" != "1" ]; then
            echo "No new continuous forecast this run; no receipt manufactured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="data/btc4h-continuous-forward"
          FILE="research/btc4h_continuous_forecasts.jsonl"
          remote_sha="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "${#remote_sha}" -eq 40
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          test "$remote_sha" = "$(git rev-parse "refs/remotes/origin/$BRANCH")"
          git show "$remote_sha:$FILE" > "$RUNNER_TEMP/btc4h-continuous-remote-ledger.jsonl"
          cmp "$RUNNER_TEMP/btc4h-continuous-remote-ledger.jsonl" "$FILE"
          export CONTINUOUS_REMOTE_SHA="$remote_sha"
          python - <<'PY'
          import hashlib,json,os
          from datetime import UTC,datetime
          from pathlib import Path
          def at(s): return datetime.fromisoformat(s.replace("Z","+00:00"))
          ledger=Path("research/btc4h_continuous_forecasts.jsonl")
          receipts=Path("research/btc4h_continuous_publication_receipts.jsonl")
          forecast=json.loads(ledger.read_text().splitlines()[-1])
          prior=[json.loads(line) for line in receipts.read_text().splitlines() if line.strip()] if receipts.exists() else []
          if any(x["origin_utc"]==forecast["origin_utc"] for x in prior):
              raise SystemExit("DUPLICATE_CONTINUOUS_RECEIPT")
          stamp=datetime.now(UTC)
          if not at(forecast["issued_at_utc"]) <= stamp < at(forecast["target_5m_close_utc"]):
              raise SystemExit("TOO_LATE_TO_CONFIRM: target closed or issue clock inconsistent")
          digest=hashlib.sha256((json.dumps(forecast,sort_keys=True,separators=(",",":"))+"\n").encode()).hexdigest()
          receipt={
              "version":forecast["version"],
              "origin_utc":forecast["origin_utc"],
              "issued_at_utc":forecast["issued_at_utc"],
              "target_5m_close_utc":forecast["target_5m_close_utc"],
              "first_party_remote_confirmed_at_utc":stamp.isoformat().replace("+00:00","Z"),
              "remote_issue_commit_sha":os.environ["CONTINUOUS_REMOTE_SHA"],
              "forecast_canonical_line_sha256":digest,
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "remote_ref_was_fetched_and_compared":True,
              "independent_time_witness":False
          }
          with receipts.open("a",encoding="utf-8") as output:
              output.write(json.dumps(receipt,sort_keys=True,separators=(",",":"))+"\n")
              output.flush()
              os.fsync(output.fileno())
          print("First-party remote publication confirmed before target. This is NOT an independent time witness.")
          PY
          bash .github/scripts/publish_btc4h_continuous.sh receipt
      - name: Score previously issued mature forecasts
        run: |
          python -m scripts.btc4h_continuous_forward --phase score --ledger research/btc4h_continuous_forecasts.jsonl --score-ledger research/btc4h_continuous_scores.jsonl --report .research/continuous_score.json --code-sha "$BTC4H_CONTINUOUS_ADAPTER_SHA"
      - name: Publish scores separately
        run: bash .github/scripts/publish_btc4h_continuous.sh score
      - name: Fail on issue execution error
        if: steps.issue.outcome == 'failure'
        run: exit 1
      - name: Fail visibly if no fresh forecast was issued
        if: steps.issue.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path(".research/continuous_issue.json").read_text())
          if result.get("newly_issued") != 1 and result.get("research_status") != "ALREADY_ISSUED":
              raise SystemExit("NO_NEW_FORECAST: " + str(result.get("research_status")))
          print("Verified issuance status:", result.get("research_status"))
          PY
      - name: Show actual issuance result
        if: always()
        shell: bash
        run: |
          cat .research/continuous_issue.json 2>/dev/null || true
          cat .research/continuous_score.json 2>/dev/null || true
