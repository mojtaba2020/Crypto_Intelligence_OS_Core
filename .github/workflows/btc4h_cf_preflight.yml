name: BTC4h Cloudflare gateway offline preflight
on:
  pull_request:
    paths:
      - 'workers/btc4h-cloudflare/**'
      - '.github/workflows/btc4h_cf_preflight.yml'
      - '.github/workflows/btc4h_cloudflare_health.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify disabled gateway and mocked dispatch logic only
        run: node --test workers/btc4h-cloudflare/test/index.test.mjs

  live-cloudflare-attestation:
    needs: offline-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Attest deployed Worker readiness; read-only, no GitHub dispatch
        shell: bash
        run: |
          set -euo pipefail
          URL='https://btc4h-free-scheduler-preflight.moji-nature.workers.dev/__health'
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "$URL" -o "$RUNNER_TEMP/btc4h-health.json"; then
              if python - "$RUNNER_TEMP/btc4h-health.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get("service") == "btc4h-free-scheduler-preflight"
          assert d.get("version") == "cutover-health-v1"
          assert d.get("armed") is True
          assert d.get("dispatches") == 0
          print("PASS: Deployed Cloudflare Worker armed and read-only health emitted zero dispatches")
          PY
              then exit 0; fi
            fi
            echo "Remote live readiness not yet confirmed (attempt $attempt)"
            sleep 15
          done
          echo "ERROR: Do not remove GitHub rolling schedule until deployment is confirmed"
          exit 1
