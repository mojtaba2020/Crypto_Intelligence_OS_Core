name: Recover and validate Phase 2 from existing bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase2_recover.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-validate-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private core repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Recover Phase 2 from the exact previously uploaded source
        run: |
          python - <<'PY'
          import hashlib
          import json
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          source = Path("Crypto_Intelligence_OS_Phase2_RealBTC_Data_v0_1_3.zip")
          target = Path("Crypto_Intelligence_OS_Phase2_RealBTC_Data_v0_1_4_verified.zip")
          known_sha = "815e73a6294ba3ce6ee58d15b1c6ef027ef7cc5f48c13ba3d1a5506c601dc849"
          fixes = {
              "src/crypto_intelligence_os/adapters/market_data/coinbase.py":
                  ("b656377b16b6c691d3b2564c8d0fdfcd07d7d930e771d82b36ea0edacbac6218", 13047),
              "tests/test_point_in_time_phase2.py":
                  ("78cac3e496b525dbcf34d9123e91a5658e41b2c194c0bd3b0dd05d7806810acf", 2391),
          }
          root = Path.cwd().resolve()
          if target.exists():
              raise SystemExit("Target exists; refusing to overwrite")
          if hashlib.sha256(source.read_bytes()).hexdigest() != known_sha:
              raise SystemExit("Existing original ZIP differs from the audited source")
          with zipfile.ZipFile(source) as zf:
              if zf.testzip() is not None:
                  raise SystemExit("Corrupt source ZIP")
              infos = [i for i in zf.infolist() if not i.is_dir()]
              prefixes = {PurePosixPath(i.filename).parts[0] for i in infos}
              if len(prefixes) != 1:
                  raise SystemExit("Expected exactly one top-level directory")
              prefix = next(iter(prefixes)) + "/"
              manifest_path = prefix + "bundle_manifest.json"
              manifest = json.loads(zf.read(manifest_path))
              if manifest.get("bundle_format_version") != "1.0" or manifest.get("bundle_id") != "phase2-real-btc-data-v0.1.3":
                  raise SystemExit("Unexpected source manifest version")
              listed = {e["path"]: e for e in manifest["files"]}
              actual = {}
              for info in infos:
                  if info.filename == manifest_path:
                      continue
                  if not info.filename.startswith(prefix):
                      raise SystemExit("Invalid ZIP path")
                  rel = info.filename[len(prefix):]
                  path = PurePosixPath(rel)
                  if not path.parts or path.is_absolute() or ".." in path.parts or path.parts[0] == ".github" or path.name == "README.md":
                      raise SystemExit("Unsafe or protected path: " + rel)
                  if stat.S_ISLNK(info.external_attr >> 16) or rel in actual:
                      raise SystemExit("Unsafe or duplicated ZIP entry: " + rel)
                  actual[rel] = zf.read(info)
              if set(actual) != set(listed):
                  raise SystemExit("Manifest file list mismatch")
              mismatches = set()
              for rel, raw in actual.items():
                  digest, size = hashlib.sha256(raw).hexdigest(), len(raw)
                  if (digest, size) != (listed[rel]["sha256"], listed[rel]["size"]):
                      mismatches.add(rel)
                      if (digest, size) != fixes.get(rel):
                          raise SystemExit("Unexpected file discrepancy: " + rel)
              if mismatches != set(fixes):
                  raise SystemExit("Unexpected list of mismatched source files")
              for rel, (digest, size) in fixes.items():
                  listed[rel]["sha256"] = digest
                  listed[rel]["size"] = size
              manifest["bundle_id"] = "phase2-real-btc-data-v0.1.4"
              manifest["description"] = "Read-only Coinbase BTC/USD ingestion; manifest integrity corrected and verified"
              replacement = (json.dumps(manifest, indent=2, ensure_ascii=False) + "\n").encode()
              with zipfile.ZipFile(target, "w", compression=zipfile.ZIP_DEFLATED) as output:
                  output.writestr(prefix + "bundle_manifest.json", replacement)
                  for rel, raw in actual.items():
                      output.writestr(prefix + rel, raw)
          with zipfile.ZipFile(target) as zf:
              if zf.testzip() is not None:
                  raise SystemExit("Rebuilt ZIP is corrupt")
              for rel, raw in actual.items():
                  if hashlib.sha256(zf.read(prefix + rel)).hexdigest() != listed[rel]["sha256"]:
                      raise SystemExit("Repacked file hash mismatch: " + rel)
                  dest = (root / rel).resolve()
                  if root not in dest.parents:
                      raise SystemExit("Invalid extraction destination")
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(raw)
                  print("Applied:", rel)
          print("Repaired source and staged Phase 2; archive SHA-256:", hashlib.sha256(target.read_bytes()).hexdigest())
          PY

      - name: Install project and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run complete project quality gate
        run: python scripts/quality_gate.py

      - name: Stage verified changes on a dedicated branch
        run: |
          BRANCH="automation/phase2-recovered-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to stage."
            exit 0
          fi
          git commit -m "Stage verified Phase 2 BTC data ingestion"
          git push --set-upstream origin "$BRANCH"
          echo "Validated Phase 2 branch: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
