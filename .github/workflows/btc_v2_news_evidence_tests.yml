name: BTC V2 news evidence unit tests

on:
  push:
    branches:
      - feature/btc-v2-news-evidence
    paths:
      - 'scripts/btc_v2_news_evidence.py'
      - 'scripts/btc_v2_news_features.py'
      - 'scripts/btc_v2_news_dataset.py'
      - 'scripts/btc_v2_source_registry.py'
      - 'scripts/btc_v2_rss_collector.py'
      - 'tests/test_btc_v2_news_evidence.py'
      - 'tests/test_btc_v2_news_features.py'
      - 'tests/test_btc_v2_news_dataset.py'
      - 'tests/test_btc_v2_rss_collector.py'
      - '.github/workflows/btc_v2_news_evidence_tests.yml'
  pull_request:
    paths:
      - 'scripts/btc_v2_news_evidence.py'
      - 'tests/test_btc_v2_news_evidence.py'
      - '.github/workflows/btc_v2_news_evidence_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-evidence:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify point-in-time evidence validator
        run: python -m unittest discover -s tests -p 'test_btc_v2_*.py' -v
