# No market API requests, no forecasts, no publication, no orders.
# One-shot deployment smoke test for pinned BTC4h continuous runtime.
name: BTC4h continuous pinned-dependencies preflight

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/btc4h_continuous_pin_preflight_20261113.yml"

permissions:
  contents: read

jobs:
  dependency-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "9de38d2c30c892d6e7ef3d65a0ee5a6507f77dc9"
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Materialize both pinned source revisions and verify import
        shell: bash
        run: |
          set -euo pipefail
          SRC=d9f8e91a713f170026878434f8514082139f6951
          for file in scripts/btc4h_continuous_forward.py .github/scripts/publish_btc4h_continuous.sh; do
            git show "$SRC:$file" > "$file"
          done
          python -m pip install -e .
          python - <<'PY'
          from datetime import UTC, datetime
          from scripts.btc4h_continuous_forward import VERSION, origin_at, in_issue_window, calculate_issue, calculate_score
          assert VERSION == "btc4h-continuous-v1-ridge100"
          assert origin_at(datetime(2026,11,14,3,40,tzinfo=UTC)) == datetime(2026,11,14,0,tzinfo=UTC)
          assert in_issue_window(datetime(2026,11,14,3,40,tzinfo=UTC))
          print("PASS: frozen continuous engine imports + 4h origin logic, no market access")
          PY
      - name: Exercise actual pre-target receipt writer against synthetic ledgers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTEST'
          import hashlib, json, os, subprocess, sys, tempfile
          from pathlib import Path
          source=subprocess.check_output(
              ["git","show",os.environ["GITHUB_SHA"]+":.github/workflows/btc4h_continuous.yml"],text=True
          )
          b=source.index("      - name: Confirm newly issued continuous forecast against remote Git")
          e=source.index("      - name: Score previously issued mature forecasts",b)
          block=source[b:e]
          begin="          python - <<'PY'\n"
          end="\n          PY\n"
          assert block.count(begin)==1 and block.count(end)==1
          raw=block.split(begin,1)[1].split(end,1)[0]
          assert all(not line or line.startswith("          ") for line in raw.split("\n"))
          script="\n".join(x[10:] for x in raw.split("\n"))+"\n"
          compile(script,"<actual-receipt-writer>","exec")
          fake=script.replace(
              "stamp=datetime.now(UTC)",
              "stamp=datetime(2026,11,14,0,55,tzinfo=UTC)"
          )
          row={
              "version":"btc4h-continuous-v1-ridge100",
              "origin_utc":"2026-11-14T00:00:00Z",
              "issued_at_utc":"2026-11-14T00:51:00Z",
              "target_5m_close_utc":"2026-11-14T04:15:00Z",
              "price_forecasts_usd":{"persistence":75000.0,"volume_interaction":74950.0}
          }
          with tempfile.TemporaryDirectory(prefix="btc4h-receipt-test-") as tmp:
              root=Path(tmp)
              (root/"research").mkdir()
              ledger=root/"research/btc4h_continuous_forecasts.jsonl"
              receipts=root/"research/btc4h_continuous_publication_receipts.jsonl"
              ledger.write_text(json.dumps(row,sort_keys=True,separators=(",",":"))+"\n")
              env={**os.environ,"CONTINUOUS_REMOTE_SHA":"a"*40,"GITHUB_RUN_ID":"synthetic-run"}
              first=subprocess.run([sys.executable,"-c",fake],cwd=root,env=env,capture_output=True,text=True)
              assert first.returncode==0,(first.stderr,first.stdout)
              receipt=json.loads(receipts.read_text().splitlines()[-1])
              digest=hashlib.sha256((json.dumps(row,sort_keys=True,separators=(",",":"))+"\n").encode()).hexdigest()
              assert receipt["forecast_canonical_line_sha256"]==digest
              assert receipt["remote_issue_commit_sha"]=="a"*40
              assert receipt["independent_time_witness"] is False
              assert receipt["first_party_remote_confirmed_at_utc"]=="2026-11-14T00:55:00Z"
              dup=subprocess.run([sys.executable,"-c",fake],cwd=root,env=env,capture_output=True,text=True)
              assert dup.returncode!=0 and "DUPLICATE_CONTINUOUS_RECEIPT" in dup.stderr
              receipts.unlink()
              late={**row,"target_5m_close_utc":"2026-11-14T00:54:00Z"}
              ledger.write_text(json.dumps(late,sort_keys=True,separators=(",",":"))+"\n")
              rejected=subprocess.run([sys.executable,"-c",fake],cwd=root,env=env,capture_output=True,text=True)
              assert rejected.returncode!=0 and "TOO_LATE_TO_CONFIRM" in rejected.stderr
          print("PASS: remote receipt code accepts timely pre-target issue, rejects duplicate and post-target receipt")
          PYTEST
