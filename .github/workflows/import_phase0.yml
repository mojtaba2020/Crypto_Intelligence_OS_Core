name: Import Phase 0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-phase0:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Extract Phase 0 safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          archive = Path("Crypto_Intelligence_OS_Phase0_v0_1.zip")
          prefix = "Crypto_Intelligence_OS_Phase0_v0_1/"
          root = Path.cwd().resolve()

          if not archive.exists():
              raise SystemExit("Phase 0 ZIP not found")

          skip = {
              Path("README.md"),
              Path(".github/workflows/ci.yml"),
          }

          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename

                  if not name.startswith(prefix):
                      raise SystemExit(f"Unexpected ZIP entry: {name}")

                  relative_name = name[len(prefix):]

                  if not relative_name:
                      continue

                  relative = Path(relative_name)

                  if relative in skip:
                      print(f"Skipping protected file: {relative}")
                      continue

                  if ".." in relative.parts:
                      raise SystemExit(f"Unsafe ZIP path: {relative}")

                  target = (root / relative).resolve()

                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe extraction target: {target}")

                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue

                  target.parent.mkdir(parents=True, exist_ok=True)

                  with zf.open(info) as source, target.open("wb") as destination:
                      shutil.copyfileobj(source, destination)

          archive.unlink()
          print("Phase 0 extracted successfully.")
          PY

      - name: Install project and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run complete Phase 0 quality gate
        run: |
          python scripts/quality_gate.py

      - name: Commit validated Phase 0 foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Import validated Phase 0 foundation"
            git push
          fi
