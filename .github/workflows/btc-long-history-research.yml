name: BTC Long-History Research

on:
  pull_request:
    paths:
      - "scripts/backfill_bitstamp_hourly.py"
      - "scripts/evaluate_bitstamp_hourly_features_v2.py"
      - "scripts/confirm_hourly_regime_hypothesis.py"
      - "research/prereg_range_mean_6h_down_low_vol_12h_v1.json"
      - "scripts/hourly_features_v2.py"
      - "scripts/attribute_hourly_candle_features_v2.py"
      - "scripts/ablate_hourly_features_v2.py"
      - "src/crypto_intelligence_os/adapters/market_data/bitstamp.py"
      - "src/crypto_intelligence_os/adapters/market_data/historical_archive.py"
      - ".github/workflows/btc-long-history-research.yml"
  workflow_dispatch:
    inputs:
      start:
        description: "UTC ISO start"
        required: true
        default: "2023-01-01T00:00:00+00:00"
      end:
        description: "UTC ISO end"
        required: true
        default: "2024-01-01T00:00:00+00:00"

permissions:
  contents: read

jobs:
  bitstamp-hourly-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e .

      - name: Backfill and validate Bitstamp hourly history
        env:
          START: ${{ github.event_name == 'workflow_dispatch' && inputs.start || '2023-01-01T00:00:00+00:00' }}
          END: ${{ github.event_name == 'workflow_dispatch' && inputs.end || '2024-01-01T00:00:00+00:00' }}
        run: |
          mkdir -p artifacts/long-history
          python scripts/backfill_bitstamp_hourly.py \
            --start "$START" \
            --end "$END" \
            --database artifacts/long-history/bitstamp-btcusd-1h.sqlite \
            --report artifacts/long-history/bitstamp-btcusd-1h-report.json

      - name: Evaluate Feature V2 on validated Bitstamp history
        run: |
          python scripts/evaluate_bitstamp_hourly_features_v2.py \
            --database artifacts/long-history/bitstamp-btcusd-1h.sqlite \
            --output artifacts/long-history/bitstamp-feature-v2-report.json \
            --train-min 720 \
            --step 24

      - name: Enforce locked primary confirmation period
        env:
          START: ${{ github.event_name == 'workflow_dispatch' && inputs.start || '2023-01-01T00:00:00+00:00' }}
          END: ${{ github.event_name == 'workflow_dispatch' && inputs.end || '2024-01-01T00:00:00+00:00' }}
        run: |
          test "$START" = "2023-01-01T00:00:00+00:00"
          test "$END" = "2024-01-01T00:00:00+00:00"

      - name: Run locked 2023 preregistered confirmation
        run: |
          python scripts/confirm_hourly_regime_hypothesis.py \
            --database artifacts/long-history/bitstamp-btcusd-1h.sqlite \
            --preregistration research/prereg_range_mean_6h_down_low_vol_12h_v1.json \
            --output artifacts/long-history/range-mean-6h-2023-confirmation.json

      - name: Upload validated research artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-long-history-bitstamp
          path: artifacts/long-history/
          if-no-files-found: error
          retention-days: 14
# Smoke trigger: validate PR-based Bitstamp hourly ingestion.
