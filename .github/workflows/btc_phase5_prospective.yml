name: BTC Phase 5 Prospective Ledger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/btc_phase5_prospective.yml
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: btc-phase5-prospective-ledger
  cancel-in-progress: false

jobs:
  prospective:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Validate code
        run: python scripts/quality_gate.py
      - name: Download historical completed daily closes
        run: |
          YESTERDAY="$(date -u -d yesterday +%F)"
          python scripts/import_btc_history.py --database .research/btc_full_history.sqlite --report .research/phase5_import.json --end "$YESTERDAY"
          LAST_DAY="$(python -c 'import sqlite3; c=sqlite3.connect(".research/btc_full_history.sqlite"); print(c.execute("SELECT MAX(day) FROM daily_price").fetchone()[0])')"
          if [[ "$LAST_DAY" < "$YESTERDAY" ]]; then
            python scripts/extend_btc_history_coinbase.py --database .research/btc_full_history.sqlite --report .research/phase5_extension.json --completed-through "$YESTERDAY"
          else
            echo '{"status":"NO_EXTENSION_NEEDED"}' > .research/phase5_extension.json
          fi
      - name: Issue immutable dated forecasts and score resolved outcomes
        run: |
          python scripts/btc_phase5_prospective.py --database .research/btc_full_history.sqlite --ledger research/phase5_forecasts.jsonl --mode issue --report .research/phase5_issued.json
          python scripts/btc_phase5_prospective.py --database .research/btc_full_history.sqlite --ledger research/phase5_forecasts.jsonl --mode score --report .research/phase5_score.json
      - name: Persist ledger in repository history
        run: |
          if [ -n "$(git status --porcelain -- research/phase5_forecasts.jsonl)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/phase5_forecasts.jsonl
            git commit -m "Record prospective BTC forecasts for completed UTC day"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload issued and scored reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: btc-phase5-prospective-reports
          path: |
            .research/phase5_import.json
            .research/phase5_extension.json
            .research/phase5_issued.json
            .research/phase5_score.json
          retention-days: 90
