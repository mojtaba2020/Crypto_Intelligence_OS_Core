name: Challenger V3 Agent Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/challenger-v3-agents
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,research]"
      - name: Compile and unit gates
        run: |
          python -m py_compile scripts/run_challenger_v3_classical_development.py scripts/multitimeframe_tournament_v2.py scripts/multitimeframe_tournament_v1.py scripts/multitimeframe_features_v3.py scripts/challenger_v3_feature_ablation.py scripts/challenger_v3_statistical_judge.py
          PYTHONPATH=scripts python -c "from multitimeframe_tournament_v2 import CANDIDATES, evaluate; print(CANDIDATES)"
          python -m pytest -q tests/test_challenger_v3_orchestrator.py tests/test_challenger_v3_workers.py tests/test_multitimeframe_features_v3.py tests/test_challenger_v3_feature_ablation.py

  prepare-data:
    needs: validate
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/challenger-v3-agents
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,research]"
      - name: Build audited development data
        run: |
          mkdir -p artifacts/real-data artifacts/prepared artifacts/v3-agent-evidence
          git rev-parse HEAD | tee artifacts/v3-agent-evidence/v3-research-commit.txt
          python scripts/fetch_multitimeframe_exchange_audit_v1.py --start "2011-08-18T00:00:00+00:00" --end "2026-09-29T00:00:00+00:00" --output-dir artifacts/real-data
          python scripts/prepare_multitimeframe_real_data_v1.py --input-dir artifacts/real-data --output-dir artifacts/prepared
          python -m scripts.challenger_v3_orchestrator --output artifacts/v3-agent-evidence/orchestrator-plan.json
          python - <<'PY'
          from pathlib import Path
          from scripts.challenger_v3_workers import run_ready_tasks
          run_ready_tasks(repo_root=Path("."), output_dir=Path("artifacts/v3-agent-evidence"))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: challenger-v3-prepared-data
          path: |
            artifacts/prepared/
            artifacts/v3-agent-evidence/
          if-no-files-found: error
          retention-days: 7

  tournament:
    needs: prepare-data
    strategy:
      fail-fast: false
      matrix:
        horizon: [1d, 2d, 3d, 1w, 2w, 3w, 1mo, 3mo]
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/challenger-v3-agents
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,research]"
      - uses: actions/download-artifact@v7
        with:
          name: challenger-v3-prepared-data
          path: artifacts
      - name: Run isolated development horizon
        run: |
          mkdir -p artifacts/v3-horizon-evidence
          python scripts/run_challenger_v3_classical_development.py \
            --data-dir artifacts/prepared \
            --exchange bitstamp \
            --horizon "${{ matrix.horizon }}" \
            --output "artifacts/v3-horizon-evidence/classical-development-${{ matrix.horizon }}.json"
      - uses: actions/upload-artifact@v6
        with:
          name: challenger-v3-${{ matrix.horizon }}-evidence
          path: artifacts/v3-horizon-evidence/
          if-no-files-found: error
          retention-days: 90

  development-statistics:
    needs: tournament
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/challenger-v3-agents
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v7
        with:
          pattern: challenger-v3-*-evidence
          path: artifacts/v3-horizon-evidence
          merge-multiple: true
      - name: Run development-only statistical diagnostics
        run: |
          mkdir -p artifacts/v3-statistical-evidence
          PYTHONPATH=scripts python scripts/challenger_v3_statistical_judge.py \
            --evidence-dir artifacts/v3-horizon-evidence \
            --output artifacts/v3-statistical-evidence/development-statistical-diagnostics.json
      - uses: actions/upload-artifact@v6
        with:
          name: challenger-v3-statistical-diagnostics
          path: artifacts/v3-statistical-evidence/
          if-no-files-found: error
          retention-days: 90

  collect:
    if: ${{ always() }}
    needs: [tournament, development-statistics]
    runs-on: ubuntu-slim
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: challenger-v3-*-evidence
          path: artifacts/v3-agent-evidence
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: challenger-v3-statistical-diagnostics
          path: artifacts/v3-agent-evidence/statistics
      - uses: actions/upload-artifact@v6
        with:
          name: challenger-v3-agent-evidence
          path: artifacts/v3-agent-evidence/
          if-no-files-found: warn
          retention-days: 90
