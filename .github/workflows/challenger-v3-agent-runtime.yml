name: Challenger V3 Agent Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v3-runtime:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout V3 research branch
        uses: actions/checkout@v7
        with:
          ref: research/challenger-v3-agents
          fetch-depth: 0

      - name: Record exact research commit
        run: git rev-parse HEAD | tee v3-research-commit.txt

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,research]"

      - name: Compile-check V3 tournament runner
        run: |
          python -m py_compile scripts/run_challenger_v3_classical_development.py scripts/multitimeframe_tournament_v2.py scripts/multitimeframe_tournament_v1.py scripts/multitimeframe_features_v3.py\n          PYTHONPATH=scripts python -c \"from multitimeframe_tournament_v2 import CANDIDATES, evaluate; print(CANDIDATES)\"

      - name: Test V3 orchestrator and workers
        run: |
          python -m pytest -q \
            tests/test_challenger_v3_orchestrator.py \
            tests/test_challenger_v3_workers.py

      - name: Build audited development data
        run: |
          mkdir -p artifacts/real-data artifacts/prepared
          python scripts/fetch_multitimeframe_exchange_audit_v1.py \
            --start "2011-08-18T00:00:00+00:00" \
            --end "2026-09-29T00:00:00+00:00" \
            --output-dir artifacts/real-data
          python scripts/prepare_multitimeframe_real_data_v1.py \
            --input-dir artifacts/real-data \
            --output-dir artifacts/prepared

      - name: Plan V3 agent waves
        run: |
          mkdir -p artifacts/v3-agent-evidence
          cp v3-research-commit.txt artifacts/v3-agent-evidence/
          python -m scripts.challenger_v3_orchestrator \
            --output artifacts/v3-agent-evidence/orchestrator-plan.json

      - name: Run bounded V3 worker waves
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.challenger_v3_workers import run_ready_tasks
          paths = run_ready_tasks(
              repo_root=Path("."),
              output_dir=Path("artifacts/v3-agent-evidence"),
          )
          print("\n".join(str(path) for path in paths))
          PY

      - name: Run V3 classical development tournament
        run: |
          python scripts/run_challenger_v3_classical_development.py \
            --data-dir artifacts/prepared \
            --exchange bitstamp \
            --output artifacts/v3-agent-evidence/classical-development-tournament.json

      - name: Upload V3 evidence
        uses: actions/upload-artifact@v6
        with:
          name: challenger-v3-agent-evidence
          path: artifacts/v3-agent-evidence/
          if-no-files-found: error
          retention-days: 90
